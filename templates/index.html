<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>할일 관리 앱</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>📝 할일 관리</h1>
            <div class="user-info">
                <span>{{ username }}님</span>
                <a href="{{ url_for('logout') }}">로그아웃</a>
            </div>
        </div>

        <form action="{{ url_for('add') }}" method="post" class="add-form">
            <input type="text" name="content" placeholder="할일을 입력하세요" autocomplete="off" required>
            <button type="submit">추가</button>
        </form>

        <ul class="todo-list">
            {% for todo in todos %}
            <li class="{{ 'done' if todo['done'] else '' }}">
                <form action="{{ url_for('toggle', todo_id=todo['id']) }}" method="post" class="toggle-form">
                    <button type="submit" class="checkbox">{{ '✔' if todo['done'] else '' }}</button>
                </form>
                <span class="content">{{ todo['content'] }}</span>
                <form action="{{ url_for('delete', todo_id=todo['id']) }}" method="post" class="delete-form">
                    <button type="submit" class="delete-btn">삭제</button>
                </form>
            </li>
            {% else %}
            <li class="empty">할일이 없습니다.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
